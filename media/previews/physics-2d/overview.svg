<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Crucible2.5D — particles, grids and material response</title>
  <desc id="desc">System schematic. Material-point particles transfer mass, momentum and stress to a grid, which returns velocity and affine motion. Fiber direction and damage alter the material stress. SPH fluids, MPM solids and Eulerian air share the wider scene.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08151e"/><stop offset="1" stop-color="#111121"/></linearGradient>
    <linearGradient id="glass" x2="0.8" y2="1"><stop stop-color="#20313b" stop-opacity=".65"/><stop offset="1" stop-color="#101923" stop-opacity=".85"/></linearGradient>
    <linearGradient id="fabric" x2="1" y2="1"><stop stop-color="#766140" stop-opacity=".6"/><stop offset="1" stop-color="#242836" stop-opacity=".8"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#65d8cf" stop-opacity=".13"/><stop offset="1" stop-color="#65d8cf" stop-opacity="0"/></radialGradient>
    <pattern id="grid" x="486" y="249" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#95abb7" stroke-opacity=".2"/></pattern>
    <pattern id="dots" width="42" height="42" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#8fabb9" opacity=".1"/></pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1L6 4L1 7" fill="none" stroke="#e1bd76" stroke-width="1.4"/></marker>
    <marker id="mint-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#74dfce" stroke-width="1.4"/></marker>
    <g id="particle"><circle r="9" fill="#69d5ca" opacity=".12"/><circle r="4.8" fill="#86ead9"/><circle cx="-1.3" cy="-1.5" r="1.5" fill="#ecfff8"/></g>
    <g id="solid"><circle r="8" fill="#e8bf77" opacity=".1"/><circle r="4.5" fill="#e9c589"/></g>
  </defs>
  <rect width="1200" height="660" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="658" rx="27" fill="url(#dots)" stroke="#657b86" stroke-opacity=".26"/>
  <ellipse cx="425" cy="330" rx="530" ry="330" fill="url(#halo)"/>
  <path d="M48 149H1152" stroke="#9cb1be" stroke-opacity=".17"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="48" y="49" font-size="20" letter-spacing="3" fill="#84d8ce">CRUCIBLE2.5D</text>
    <text x="48" y="101" font-size="42" font-weight="600" fill="#f3eee2">A material is more than its motion.</text>
    <text x="49" y="132" font-size="21" fill="#a9bdc8">Particles carry state. Grids exchange it. Constitutive laws determine the response.</text>
    <rect x="938" y="24" width="213" height="38" rx="19" fill="#ddbb78" fill-opacity=".07" stroke="#ddbb78" stroke-opacity=".4"/>
    <text x="1044" y="50" text-anchor="middle" font-size="20" fill="#dec89b">System schematic</text>

    <rect x="48" y="184" width="320" height="318" rx="22" fill="url(#glass)" stroke="#6ad9cb" stroke-opacity=".5"/>
    <rect x="440" y="184" width="320" height="318" rx="22" fill="url(#glass)" stroke="#e1bd76" stroke-opacity=".55"/>
    <rect x="832" y="184" width="320" height="318" rx="22" fill="url(#glass)" stroke="#ad95eb" stroke-opacity=".5"/>
    <text x="73" y="222" font-size="22" font-weight="600" fill="#8fe8d8">Particles</text>
    <text x="465" y="222" font-size="22" font-weight="600" fill="#e8c78b">Grid exchange</text>
    <text x="857" y="222" font-size="22" font-weight="600" fill="#c2aff3">Material response</text>
    <text x="73" y="474" font-size="20" fill="#b2c5cd">Mass · velocity · temperature</text>
    <text x="465" y="474" font-size="20" fill="#b2c5cd">Weighted local support</text>
    <text x="857" y="474" font-size="20" fill="#b2c5cd">Fiber direction · damage</text>
  </g>

  <!-- Particles carry persistent state; the points are schematic, not sampled output. -->
  <path d="M80 388C98 307 150 286 197 314S239 382 301 369" fill="none" stroke="#64d7c6" stroke-opacity=".14" stroke-width="35" filter="url(#glow)"/>
  <path d="M93 384C116 339 160 328 191 352S242 399 306 375" fill="none" stroke="#77dcca" stroke-opacity=".25" stroke-width="1.5"/>
  <g>
    <use href="#particle" x="89" y="385"/><use href="#particle" x="103" y="359"/><use href="#particle" x="119" y="335"/><use href="#particle" x="144" y="323"/>
    <use href="#particle" x="166" y="332"/><use href="#particle" x="187" y="349"/><use href="#particle" x="207" y="367"/><use href="#particle" x="233" y="381"/>
    <use href="#particle" x="257" y="385"/><use href="#particle" x="283" y="382"/><use href="#particle" x="309" y="372"/>
    <use href="#particle" x="104" y="403"/><use href="#particle" x="122" y="378"/><use href="#particle" x="141" y="355"/><use href="#particle" x="169" y="362"/>
    <use href="#particle" x="190" y="383"/><use href="#particle" x="212" y="402"/><use href="#particle" x="238" y="413"/><use href="#particle" x="265" y="410"/>
  </g>
  <g transform="translate(229 279) rotate(-15)">
    <path d="M-33 -18H66M-33 4H66M-33 26H66" stroke="#e7be78" stroke-opacity=".35"/>
    <use href="#solid" x="-33" y="-18"/><use href="#solid" x="0" y="-18"/><use href="#solid" x="33" y="-18"/><use href="#solid" x="66" y="-18"/>
    <use href="#solid" x="-33" y="4"/><use href="#solid" x="0" y="4"/><use href="#solid" x="33" y="4"/><use href="#solid" x="66" y="4"/>
    <use href="#solid" x="-33" y="26"/><use href="#solid" x="0" y="26"/><use href="#solid" x="33" y="26"/><use href="#solid" x="66" y="26"/>
  </g>
  <g fill="none" stroke="#7ee2d2" stroke-width="1.6" marker-end="url(#mint-arrow)"><path d="M144 304L160 280"/><path d="M206 410L225 423"/><path d="M290 355L316 344"/></g>

  <!-- Local quadratic transfer footprint and accumulated grid quantities. -->
  <rect x="486" y="249" width="228" height="190" rx="4" fill="url(#grid)" stroke="#afbec6" stroke-opacity=".17"/>
  <rect x="524" y="287" width="114" height="114" rx="12" fill="#79d7c7" opacity=".06" stroke="#75dbcd" stroke-opacity=".25"/>
  <g stroke="#80e5d4" stroke-opacity=".45" stroke-width="1.5">
    <path d="M580 345L524 287M580 345L562 287M580 345L600 287M580 345L524 325M580 345L562 325M580 345L600 325M580 345L524 363M580 345L562 363M580 345L600 363"/>
  </g>
  <g fill="#82e0d0">
    <circle cx="524" cy="287" r="3" opacity=".3"/><circle cx="562" cy="287" r="4" opacity=".45"/><circle cx="600" cy="287" r="3" opacity=".3"/>
    <circle cx="524" cy="325" r="4" opacity=".45"/><circle cx="562" cy="325" r="9" opacity=".85"/><circle cx="600" cy="325" r="6" opacity=".65"/>
    <circle cx="524" cy="363" r="3" opacity=".3"/><circle cx="562" cy="363" r="6" opacity=".7"/><circle cx="600" cy="363" r="4" opacity=".5"/>
  </g>
  <circle cx="580" cy="345" r="8" fill="#edc989" stroke="#fff1cb" stroke-width="2"/>
  <g fill="none" stroke="#e6c07b" stroke-width="2" marker-end="url(#arrow)"><path d="M656 282L682 270"/><path d="M656 330L687 316"/><path d="M656 378L680 365"/></g>

  <!-- The law is an input to stress, not a claim that the diagram is a simulation. -->
  <path d="M876 304L1098 271L1117 382L896 417Z" fill="url(#fabric)" stroke="#e6bf7a" stroke-opacity=".65"/>
  <g stroke="#e4c07f" stroke-width="2" stroke-opacity=".7">
    <path d="M881 324L1102 291M885 344L1106 311M888 364L1110 331M892 384L1113 351M895 404L1117 371"/>
  </g>
  <path d="M888 365L922 359L945 365L968 351L998 351L1027 340L1057 345L1087 336L1113 331" fill="none" stroke="#9c75d9" stroke-width="16" opacity=".5" filter="url(#glow)"/>
  <path d="M888 365L922 359L945 365L968 351L998 351L1027 340L1057 345L1087 336L1113 331" fill="none" stroke="#111923" stroke-width="6"/>
  <path d="M888 365L922 359L945 365L968 351L998 351L1027 340L1057 345L1087 336L1113 331" fill="none" stroke="#c6adf7" stroke-width="1.5"/>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="21">
    <text x="997" y="252" text-anchor="middle" fill="#decba5">σ = σ(F, T, d)</text>
    <text x="404" y="307" text-anchor="middle" fill="#e5c486" font-size="20">P2G</text>
    <text x="404" y="398" text-anchor="middle" fill="#8ce1d2" font-size="20">G2P</text>
  </g>
  <path d="M378 326H430" fill="none" stroke="#e1bd76" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M430 370H378" fill="none" stroke="#74dfce" stroke-width="2" marker-end="url(#mint-arrow)"/>
  <path d="M772 345H820" fill="none" stroke="#e1bd76" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="48" y="543" font-size="21" fill="#ddc492">P2G: mass, momentum and stress → grid</text>
    <text x="637" y="543" font-size="21" fill="#8ddacb">G2P: velocity + affine motion → particles</text>
    <path d="M48 567H1152" stroke="#abc1cd" stroke-opacity=".16"/>
    <circle cx="61" cy="603" r="6" fill="#79decb"/><text x="78" y="610" font-size="22" fill="#d3e4e5">SPH fluids</text>
    <circle cx="284" cy="603" r="6" fill="#e9c586"/><text x="301" y="610" font-size="22" fill="#e8dfd1">MPM solids</text>
    <circle cx="523" cy="603" r="6" fill="#ad98e4"/><text x="540" y="610" font-size="22" fill="#ddd5ef">Eulerian air</text>
    <text x="1152" y="610" text-anchor="end" font-size="20" fill="#9cafbf">A shared world of motion, heat and fields</text>
  </g>
</svg>

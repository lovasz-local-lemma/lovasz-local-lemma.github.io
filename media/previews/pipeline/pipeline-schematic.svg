<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc"><title id="title">WebGPU Atelier: inspect the pipeline</title><desc id="desc">Architecture schematic: geometry writes color, normal and depth buffers, compute and lighting operate on data, and a composite produces the image. The boxes illustrate stages rather than depicting captured output.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#19262e"/><stop offset="1" stop-color="#101216"/></linearGradient><linearGradient id="normal" x2="1" y2="1"><stop stop-color="#d9a0e5"/><stop offset=".55" stop-color="#82b5ef"/><stop offset="1" stop-color="#78d4b2"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#e4c884" stroke-width="1.5"/></marker></defs><rect width="720" height="440" rx="22" fill="url(#bg)"/><rect x="1" y="1" width="718" height="438" rx="22" fill="none" stroke="#d6bd80" stroke-opacity=".5"/><g font-family="Segoe UI,Arial,sans-serif"><text x="35" y="42" fill="#d6bd80" font-size="13" letter-spacing="2">WEBGPU ATELIER</text><text x="35" y="81" fill="#f4efdf" font-size="27">The image, and everything before it.</text><g fill="#ffffff" fill-opacity=".025" stroke="#d6bd80" stroke-opacity=".5"><rect x="35" y="126" width="180" height="224" rx="14"/><rect x="270" y="126" width="180" height="224" rx="14"/><rect x="505" y="126" width="180" height="224" rx="14"/></g><g fill="none" stroke="#e4c884" stroke-width="1.7" marker-end="url(#arrow)"><path d="M225 238 H259"/><path d="M460 238 H494"/></g><g stroke="#8cbab4" fill="none" stroke-width="1.3"><path d="M72 230 127 160 177 230 127 288 Z M72 230 127 208 177 230 M127 160 V288 M127 208 89 208 M127 208 160 208"/></g><rect x="290" y="154" width="136" height="55" rx="7" fill="#3f7179"/><rect x="300" y="172" width="136" height="55" rx="7" fill="url(#normal)"/><rect x="310" y="190" width="122" height="72" rx="7" fill="#6c787b" stroke="#a2b8bb"/><circle cx="371" cy="224" r="25" fill="#c0c9bd"/><g fill="none" stroke="#8fb1b4" stroke-opacity=".3"><path d="M526 264 594 207 664 264 M526 236 H664 M536 280 594 207 651 280 M543 255 H650"/></g><circle cx="594" cy="211" r="46" fill="url(#normal)"/><circle cx="580" cy="195" r="12" fill="#f4edce" fill-opacity=".5"/><g fill="#f4efdf" font-size="18" font-weight="600"><text x="57" y="314">Geometry</text><text x="291" y="314">Buffers</text><text x="527" y="314">Composite</text></g><g fill="#9db0b8" font-size="12"><text x="57" y="335">Transform · rasterize</text><text x="291" y="335">Color · normal · depth</text><text x="527" y="335">Light · inspect · compare</text><text x="35" y="398" font-size="13">Architecture schematic · rendering stages · compute fields · independent laboratories</text></g></g></svg>
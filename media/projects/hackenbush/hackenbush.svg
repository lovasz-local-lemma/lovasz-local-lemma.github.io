<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Hackenbush: two numbers and a game that is not a number</title><desc id="desc">A blue edge below a red edge has value one half. Reversing the colors gives minus one half. A single green edge has value star and is not a surreal number.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d27"/><stop offset="1" stop-color="#121111"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="7"/></filter></defs>
<rect width="1280" height="720" rx="30" fill="url(#bg)"/>
<g font-family="Georgia,serif" fill="#edd69c"><text x="64" y="90" font-size="23" letter-spacing="4">EXACT GAMES · VISIBLE CONSEQUENCES</text><text x="64" y="156" font-size="43">When a position becomes a number</text></g>
<g fill="#14212c" stroke="#536268" stroke-opacity=".55"><rect x="62" y="208" width="350" height="422" rx="24"/><rect x="465" y="208" width="350" height="422" rx="24"/><rect x="868" y="208" width="350" height="422" rx="24"/></g>
<g stroke-linecap="round" stroke-width="12"><path d="M237 454V370" stroke="#69adff"/><path d="M237 370V286" stroke="#ee797d"/><path d="M640 454V370" stroke="#ee797d"/><path d="M640 370V286" stroke="#69adff"/><path d="M1043 454V318" stroke="#7fe3b0"/></g>
<g fill="#f5e7bd"><circle cx="237" cy="286" r="9"/><circle cx="237" cy="370" r="9"/><circle cx="640" cy="286" r="9"/><circle cx="640" cy="370" r="9"/><circle cx="1043" cy="318" r="9"/></g>
<g stroke="#9d895a" stroke-width="3"><path d="M139 463H335M542 463H738M945 463H1141"/></g>
<g font-family="Georgia,serif" fill="#f0db9b" text-anchor="middle" font-size="40"><text x="237" y="528">{ 0 | 1 } = ½</text><text x="640" y="528">{ −1 | 0 } = −½</text><text x="1043" y="528">{ 0 | 0 } = *</text></g>
<g font-family="system-ui,sans-serif" fill="#bcc8ce" font-size="19" text-anchor="middle"><text x="237" y="576">Blue below red</text><text x="640" y="576">Red below blue</text><text x="1043" y="576">Green: first player wins</text></g>
<text x="64" y="681" font-family="system-ui,sans-serif" font-size="18" fill="#96a6ad">Illustrated finite positions · canonical values under ordinary normal-play cut rules</text>
</svg>

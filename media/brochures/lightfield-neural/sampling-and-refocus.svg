<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="540" viewBox="0 0 1440 540" role="img" aria-labelledby="title desc">
<title id="title">Coverage, density and refocus are three different choices</title>
<desc id="desc">Sparse cameras leave gaps, closer cameras provide overlapping directions, and refocusing aligns their rays on a selected depth plane. Diagram only; not a captured render.</desc>
<defs><radialGradient id="glow"><stop stop-color="#9ad7ca" stop-opacity=".16"/><stop offset="1" stop-color="#9ad7ca" stop-opacity="0"/></radialGradient></defs>
<rect width="1440" height="540" rx="18" fill="#0d191d"/>
<g fill="none" stroke="#6e8985" stroke-opacity=".28"><rect x="20" y="20" width="440" height="500" rx="12"/><rect x="500" y="20" width="440" height="500" rx="12"/><rect x="980" y="20" width="440" height="500" rx="12"/></g>
<g font-family="Georgia,serif" font-size="27" fill="#e8dec0"><text x="48" y="66">01 · Cover the viewing range</text><text x="528" y="66">02 · Fill the gaps</text><text x="1008" y="66">03 · Choose what aligns</text></g>
<g fill="#adbfbe" font-family="Arial,sans-serif" font-size="18"><text x="48" y="104">More directions ≠ denser sampling</text><text x="528" y="104">More views; fewer pixels per view</text><text x="1008" y="104">Aperture gathers, focus aligns</text></g>
<g transform="translate(240 286)" fill="none"><circle r="127" stroke="#637777" stroke-dasharray="4 7"/><rect x="-36" y="-42" width="72" height="84" rx="6" stroke="#debb73" stroke-width="2"/>
<g stroke="#96d6c7" stroke-width="2"><path d="M0 -127 -30 -42M0 -127 30 -42M127 0 36 -30M127 0 36 30M0 127 -30 42M0 127 30 42M-127 0 -36 -30M-127 0 -36 30"/></g>
<g fill="#debb73"><circle cy="-127" r="7"/><circle cx="127" r="7"/><circle cy="127" r="7"/><circle cx="-127" r="7"/></g><text x="67" y="-82" fill="#b48469" font-family="Arial,sans-serif" font-size="16">gap</text></g>
<g transform="translate(720 286)"><circle r="142" fill="url(#glow)"/><circle r="127" fill="none" stroke="#637777" stroke-dasharray="4 7"/><rect x="-36" y="-42" width="72" height="84" rx="6" fill="none" stroke="#debb73" stroke-width="2"/>
<g fill="#debb73" stroke="#96d6c7" stroke-width="1.3" stroke-opacity=".5">
<path d="M0 -127 0 -42M49 -117 20 -42M90 -90 36 -36M117 -49 36 -20M127 0 36 0M117 49 36 20M90 90 30 42M49 117 16 42M0 127 0 42M-49 117 -16 42M-90 90 -30 42M-117 49 -36 20M-127 0 -36 0M-117 -49 -36 -20M-90 -90 -36 -36M-49 -117 -20 -42" fill="none"/>
<circle cy="-127" r="5"/><circle cx="49" cy="-117" r="5"/><circle cx="90" cy="-90" r="5"/><circle cx="117" cy="-49" r="5"/><circle cx="127" r="5"/><circle cx="117" cy="49" r="5"/><circle cx="90" cy="90" r="5"/><circle cx="49" cy="117" r="5"/><circle cy="127" r="5"/><circle cx="-49" cy="117" r="5"/><circle cx="-90" cy="90" r="5"/><circle cx="-117" cy="49" r="5"/><circle cx="-127" r="5"/><circle cx="-117" cy="-49" r="5"/><circle cx="-90" cy="-90" r="5"/><circle cx="-49" cy="-117" r="5"/>
</g></g>
<g fill="none" stroke-width="2"><path d="M1027 395H1384" stroke="#637777"/><path d="M1017 212H1390" stroke="#debb73" stroke-dasharray="5 5"/><path d="M1048 395 1200 212 1260 140M1124 395 1200 212 1230 140M1276 395 1200 212 1170 140M1352 395 1200 212 1140 140" stroke="#96d6c7" stroke-opacity=".7"/></g>
<g fill="#debb73"><circle cx="1048" cy="395" r="7"/><circle cx="1124" cy="395" r="7"/><circle cx="1276" cy="395" r="7"/><circle cx="1352" cy="395" r="7"/><circle cx="1200" cy="212" r="7"/></g>
<g font-family="Arial,sans-serif" font-size="16" fill="#c8c5ac"><text x="1250" y="239">focus plane</text><text x="1132" y="427">synthetic aperture</text></g>
<g font-family="Arial,sans-serif" font-size="18" fill="#adbfbe"><text x="48" y="472">Blur hides holes, but cannot recover</text><text x="48" y="495">views the array never captured.</text><text x="528" y="472">Trade some image detail for smoother</text><text x="528" y="495">motion and a wider useful viewing range.</text><text x="1008" y="472">Aligned depth stays sharp; other</text><text x="1008" y="495">depths spread across the combined image.</text></g>
</svg>

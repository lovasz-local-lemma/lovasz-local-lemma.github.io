<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Trace once. Choose what to retain.</title><desc id="desc">A retained world-space path cache feeds surface textures or live primitives. A shared clock changes represented time, while scene or transport edits may invalidate the cache.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101920"/><stop offset="1" stop-color="#090d13"/></linearGradient><linearGradient id="card" x2="1" y2="1"><stop stop-color="#21303a"/><stop offset="1" stop-color="#141b24"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#d7b776" stroke-width="1.5"/></marker></defs><rect width="1200" height="630" rx="20" fill="url(#bg)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="36" y="48" fill="#f0dfb8" font-size="28" font-weight="600">Trace once. Choose what to retain.</text><text x="36" y="80" fill="#aeb8c4" font-size="17">Scene3D separates transport work, representation, projection and playback.</text><rect x="35" y="109" width="330" height="122" rx="15" fill="url(#card)" stroke="#79ccb8" stroke-opacity=".6"/><rect x="51" y="128" width="3" height="23" rx="1.5" fill="#79ccb8"/><text x="64" y="146" fill="#79ccb8" font-size="20" font-weight="600">Scene + materials</text><text x="53" y="175" fill="#c0cad3" font-size="17">Geometry · lights · medium</text><text x="53" y="200" fill="#c0cad3" font-size="17">Transport parameters</text><rect x="435" y="109" width="330" height="122" rx="15" fill="url(#card)" stroke="#79ccb8" stroke-opacity=".6"/><rect x="451" y="128" width="3" height="23" rx="1.5" fill="#79ccb8"/><text x="464" y="146" fill="#79ccb8" font-size="20" font-weight="600">TracedPaths</text><text x="453" y="175" fill="#c0cad3" font-size="17">Forward photon trajectories</text><text x="453" y="200" fill="#c0cad3" font-size="17">World-space path vertices</text><rect x="835" y="109" width="330" height="122" rx="15" fill="url(#card)" stroke="#79ccb8" stroke-opacity=".6"/><rect x="851" y="128" width="3" height="23" rx="1.5" fill="#79ccb8"/><text x="864" y="146" fill="#79ccb8" font-size="20" font-weight="600">Retained cache</text><text x="853" y="175" fill="#c0cad3" font-size="17">Positions · directions · power</text><text x="853" y="200" fill="#c0cad3" font-size="17">Arrival / optical time</text><path d="M365 170H422" fill="none" stroke="#d7b776" stroke-width="1.8" opacity=".8" marker-end="url(#arrow)"/><path d="M765 170H822" fill="none" stroke="#d7b776" stroke-width="1.8" opacity=".8" marker-end="url(#arrow)"/><path d="M1000 231V266H200V307" fill="none" stroke="#d7b776" stroke-width="1.8" opacity=".8" marker-end="url(#arrow)"/><path d="M1000 266H600V307" fill="none" stroke="#d7b776" stroke-width="1.8" opacity=".8" marker-end="url(#arrow)"/><rect x="35" y="319" width="330" height="122" rx="15" fill="url(#card)" stroke="#79ccb8" stroke-opacity=".6"/><rect x="51" y="338" width="3" height="23" rx="1.5" fill="#79ccb8"/><text x="64" y="356" fill="#79ccb8" font-size="20" font-weight="600">Surface lightmap</text><text x="53" y="385" fill="#c0cad3" font-size="17">Gather to face textures</text><text x="53" y="410" fill="#c0cad3" font-size="17">Integrated, sliced or mean time</text><rect x="435" y="319" width="330" height="122" rx="15" fill="url(#card)" stroke="#79ccb8" stroke-opacity=".6"/><rect x="451" y="338" width="3" height="23" rx="1.5" fill="#79ccb8"/><text x="464" y="356" fill="#79ccb8" font-size="20" font-weight="600">Live photon primitives</text><text x="453" y="385" fill="#c0cad3" font-size="17">Points · beams · swept forms</text><text x="453" y="410" fill="#c0cad3" font-size="17">Different geometric kernels</text><rect x="835" y="319" width="330" height="122" rx="15" fill="url(#card)" stroke="#a9afe9" stroke-opacity=".6"/><rect x="851" y="338" width="3" height="23" rx="1.5" fill="#a9afe9"/><text x="864" y="356" fill="#a9afe9" font-size="20" font-weight="600">Project + compose</text><text x="853" y="385" fill="#c0cad3" font-size="17">Native preview</text><text x="853" y="410" fill="#c0cad3" font-size="17">Bake to .riv or custom replay</text><path d="M365 380H396V465H801V405H822" fill="none" stroke="#d7b776" stroke-width="1.8" opacity=".8" marker-end="url(#arrow)"/><path d="M765 370H822" fill="none" stroke="#d7b776" stroke-width="1.8" opacity=".8" marker-end="url(#arrow)"/><rect x="435" y="491" width="330" height="92" rx="15" fill="url(#card)" stroke="#d7b776" stroke-opacity=".6"/><rect x="451" y="510" width="3" height="23" rx="1.5" fill="#d7b776"/><text x="464" y="528" fill="#d7b776" font-size="20" font-weight="600">Shared Clock</text><text x="453" y="557" fill="#c0cad3" font-size="17">Select the represented instant</text><path d="M600 491V451" fill="none" stroke="#d7b776" stroke-width="1.8" opacity=".8" marker-end="url(#arrow)" stroke-dasharray="6 5"/><path d="M435 535H200V451" fill="none" stroke="#d7b776" stroke-width="1.8" opacity=".8" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="36" y="606" fill="#aeb8c4" font-size="16">Dashed: time control. Mean-arrival reconstruction is approximate; supported export modes differ.</text></g></svg>
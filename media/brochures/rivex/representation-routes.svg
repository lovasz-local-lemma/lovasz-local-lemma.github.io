<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 525" role="img" aria-labelledby="title desc"><title id="title">From rendered image to editable drawing</title><desc id="desc">Two implementations: image passes over explicit fields, or geometric drawing methods exported as Rive objects.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101920"/><stop offset="1" stop-color="#090d13"/></linearGradient><linearGradient id="card" x2="1" y2="1"><stop stop-color="#21303a"/><stop offset="1" stop-color="#141b24"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#d7b776" stroke-width="1.5"/></marker></defs><rect width="1200" height="525" rx="20" fill="url(#bg)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="36" y="48" fill="#f0dfb8" font-size="28" font-weight="600">From rendered image to editable drawing</text><text x="36" y="80" fill="#aeb8c4" font-size="17">Two implementations can resemble one another without carrying the same information.</text><text x="36" y="122" fill="#9ca8ee" font-size="15" letter-spacing="2">IMAGE / SHADER ROUTE</text><rect x="35" y="139" width="260" height="122" rx="15" fill="url(#card)" stroke="#a9afe9" stroke-opacity=".6"/><rect x="51" y="158" width="3" height="23" rx="1.5" fill="#a9afe9"/><text x="64" y="176" fill="#a9afe9" font-size="20" font-weight="600">Scene + animation</text><text x="53" y="205" fill="#c0cad3" font-size="17">Native geometry or .riv</text><text x="53" y="230" fill="#c0cad3" font-size="17">Preserve shape identity</text><rect x="325" y="139" width="260" height="122" rx="15" fill="url(#card)" stroke="#a9afe9" stroke-opacity=".6"/><rect x="341" y="158" width="3" height="23" rx="1.5" fill="#a9afe9"/><text x="354" y="176" fill="#a9afe9" font-size="20" font-weight="600">Color + auxiliary fields</text><text x="343" y="205" fill="#c0cad3" font-size="17">Orientation, contours, motion</text><text x="343" y="230" fill="#c0cad3" font-size="17">2D order or scene depth</text><rect x="615" y="139" width="260" height="122" rx="15" fill="url(#card)" stroke="#a9afe9" stroke-opacity=".6"/><rect x="631" y="158" width="3" height="23" rx="1.5" fill="#a9afe9"/><text x="644" y="176" fill="#a9afe9" font-size="20" font-weight="600">NPR shader passes</text><text x="633" y="205" fill="#c0cad3" font-size="17">Original / previous / state</text><text x="633" y="230" fill="#c0cad3" font-size="17">Inspect each intermediate</text><rect x="905" y="139" width="260" height="122" rx="15" fill="url(#card)" stroke="#a9afe9" stroke-opacity=".6"/><rect x="921" y="158" width="3" height="23" rx="1.5" fill="#a9afe9"/><text x="934" y="176" fill="#a9afe9" font-size="20" font-weight="600">Rendered image</text><text x="923" y="205" fill="#c0cad3" font-size="17">Fast look development</text><text x="923" y="230" fill="#c0cad3" font-size="17">Custom execution path</text><path d="M295 200H317" fill="none" stroke="#d7b776" stroke-width="1.8" opacity=".8" marker-end="url(#arrow)"/><path d="M585 200H607" fill="none" stroke="#d7b776" stroke-width="1.8" opacity=".8" marker-end="url(#arrow)"/><path d="M875 200H897" fill="none" stroke="#d7b776" stroke-width="1.8" opacity=".8" marker-end="url(#arrow)"/><text x="36" y="307" fill="#83d8bf" font-size="15" letter-spacing="2">GEOMETRIC / VECTOR ROUTE</text><rect x="35" y="324" width="260" height="122" rx="15" fill="url(#card)" stroke="#79ccb8" stroke-opacity=".6"/><rect x="51" y="343" width="3" height="23" rx="1.5" fill="#79ccb8"/><text x="64" y="361" fill="#79ccb8" font-size="20" font-weight="600">Scene + lighting</text><text x="53" y="390" fill="#c0cad3" font-size="17">Supported 3D geometry</text><text x="53" y="415" fill="#c0cad3" font-size="17">Direct-light construction</text><rect x="325" y="324" width="260" height="122" rx="15" fill="url(#card)" stroke="#79ccb8" stroke-opacity=".6"/><rect x="341" y="343" width="3" height="23" rx="1.5" fill="#79ccb8"/><text x="354" y="361" fill="#79ccb8" font-size="20" font-weight="600">Analytic tone / edges</text><text x="343" y="390" fill="#c0cad3" font-size="17">Shared drawing substrate</text><text x="343" y="415" fill="#c0cad3" font-size="17">Boundaries and tone</text><rect x="615" y="324" width="260" height="122" rx="15" fill="url(#card)" stroke="#79ccb8" stroke-opacity=".6"/><rect x="631" y="343" width="3" height="23" rx="1.5" fill="#79ccb8"/><text x="644" y="361" fill="#79ccb8" font-size="20" font-weight="600">Paths + paints</text><text x="633" y="390" fill="#c0cad3" font-size="17">Hatch · Inkline · Brush</text><text x="633" y="415" fill="#c0cad3" font-size="17">Coats, strokes, fills</text><rect x="905" y="324" width="260" height="122" rx="15" fill="url(#card)" stroke="#79ccb8" stroke-opacity=".6"/><rect x="921" y="343" width="3" height="23" rx="1.5" fill="#79ccb8"/><text x="934" y="361" fill="#79ccb8" font-size="20" font-weight="600">Standard .riv</text><text x="923" y="390" fill="#c0cad3" font-size="17">Editable vector objects</text><text x="923" y="415" fill="#c0cad3" font-size="17">Official-runtime playback</text><path d="M295 385H317" fill="none" stroke="#d7b776" stroke-width="1.8" opacity=".8" marker-end="url(#arrow)"/><path d="M585 385H607" fill="none" stroke="#d7b776" stroke-width="1.8" opacity=".8" marker-end="url(#arrow)"/><path d="M875 385H897" fill="none" stroke="#d7b776" stroke-width="1.8" opacity=".8" marker-end="url(#arrow)"/><text x="36" y="482" fill="#aeb8c4" font-size="17">The shader route does not become vector geometry automatically. Selected methods are rebuilt.</text></g></svg>
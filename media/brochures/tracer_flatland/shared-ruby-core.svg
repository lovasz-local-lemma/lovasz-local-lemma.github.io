<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
<title id="title">Flatland desktop application and simplified browser showcase</title>
<desc id="desc">The desktop Raylib application uses its original path and light tracer classes. Separately, the corrected FlatlandTransport Ruby file is used by native tests and copied unchanged for execution by ruby.wasm in the browser worker. JavaScript draws returned geometry and events.</desc>
<defs><linearGradient id="glass" x2="0" y2="1"><stop stop-color="#242b40"/><stop offset="1" stop-color="#101b27"/></linearGradient><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#8bccdf" stroke-width="1.5"/></marker></defs>
<rect x="1" y="1" width="1198" height="568" rx="22" fill="#0d141e" stroke="#44546f"/>
<g font-family="Segoe UI, sans-serif"><text x="36" y="48" fill="#ecedf5" font-size="27" font-weight="600">A desktop application and a focused browser showcase</text><text x="36" y="80" fill="#acb6ca" font-size="18">The browser and native measurement tools execute the same corrected Ruby core.</text>
<rect x="36" y="111" width="1128" height="100" rx="16" fill="#242234" stroke="#706082"/>
<text x="59" y="144" fill="#e0c9ee" font-size="22" font-weight="600">Desktop application · Raylib</text><text x="59" y="179" fill="#c2b5cb" font-size="18">main.rb → path_tracer.rb / light_tracer.rb</text><text x="679" y="144" fill="#c2b5cb" font-size="18">Draggable camera · material lobes · aperture</text><text x="679" y="179" fill="#c2b5cb" font-size="18">Medium experiments · sensor-path inspection</text>
<g fill="url(#glass)" stroke="#527c92" stroke-width="1.5"><rect x="36" y="281" width="353" height="135" rx="16"/><rect x="503" y="249" width="292" height="91" rx="16"/><rect x="503" y="365" width="292" height="91" rx="16"/><rect x="906" y="365" width="258" height="91" rx="16"/></g>
<g fill="none" stroke="#8bccdf" stroke-width="2.5" marker-end="url(#a)"><path d="M389 320C447 320 441 293 503 293"/><path d="M389 379C445 379 445 410 503 410"/><path d="M795 410H906"/></g>
<text x="58" y="316" fill="#eef5f9" font-size="22" font-weight="600">Corrected Ruby transport</text><text x="58" y="351" fill="#a8c8d7" font-size="18">lib/flatland_transport.rb</text><text x="58" y="389" fill="#a8c8d7" font-size="17">PT · direct-light MIS · LT · photon map</text>
<text x="525" y="283" fill="#eef5f9" font-size="21" font-weight="600">Native Ruby</text><text x="525" y="313" fill="#a8c8d7" font-size="18">Tests + headless measurements</text>
<text x="525" y="398" fill="#eef5f9" font-size="21" font-weight="600">ruby.wasm worker</text><text x="525" y="431" fill="#a8c8d7" font-size="18">Identical copied transport.rb</text>
<text x="927" y="398" fill="#eef5f9" font-size="21" font-weight="600">Browser canvas</text><text x="927" y="431" fill="#a8c8d7" font-size="18">Returned paths + event values</text>
<path d="M36 492H1164" stroke="#304459"/><text x="36" y="529" fill="#bbc9dc" font-size="19">Shared-code claim: browser ↔ native corrected-core tools. The desktop still uses its separate renderer classes.</text>
</g></svg>

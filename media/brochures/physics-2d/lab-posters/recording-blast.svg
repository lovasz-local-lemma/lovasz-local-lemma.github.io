<text x="40" y="83" fill="#f0ecdc" font-family="Georgia, serif" font-size="33" font-weight="400" >The front moves between frames.</text>
<text x="40" y="115" fill="#a9bdb5" font-family="Arial, sans-serif" font-size="16" font-weight="400" >A thin ring can miss a probe. A swept annulus records its crossing.</text>

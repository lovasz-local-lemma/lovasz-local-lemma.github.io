<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><defs><radialGradient id="bg"><stop stop-color="#243940"/><stop offset="1" stop-color="#091321"/></radialGradient></defs><rect width="1280" height="720" fill="url(#bg)"/><g font-family="Segoe UI,sans-serif"><g transform="translate(360 315)" fill="none" stroke-width="2"><circle r="160" stroke="#b5a8df44"/><path d="M-200 0H200M0-195V195" stroke="#b5a8df44"/><path d="M0 0 135-75" stroke="#85e5c6" stroke-width="5"/><path d="m135-75-78-82" stroke="#b49cf6" stroke-width="5"/><path d="M0 0 57-157" stroke="#f3d18b" stroke-width="5"/></g><text x="660" y="285" fill="#ecd79f" font-size="38">P = P₀ + P₁</text><text x="660" y="340" fill="#abc5cf" font-size="25">Four taps. One summed phasor.</text><text x="660" y="382" fill="#abc5cf" font-size="22">Multipath changes amplitude and phase.</text><text x="55" y="600" fill="#e8e6d9" font-size="32">The sensor sums paths before it estimates depth.</text><text x="55" y="643" fill="#a8bcca" font-size="23">Computed four-tap correlation and calibrated phase recovery</text></g></svg>
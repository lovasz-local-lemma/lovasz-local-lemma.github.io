        stat.textContent = n ? ('Pose-budget study: discrete baked samples; scrub to inspect. ' + r.animationNames[0]) : 'loaded (static artboard)';
        try { setupUi(); fit(); seek(0); } catch (e) { stat.textContent = 'controls failed: ' + e; }
      },
      onLoadError: function(e){ fail('The runtime loaded but REFUSED this file.<br>That is a real result: it means the bytes are not a valid .riv.<br><code>' + e + '</code>'); }
    });
  } catch (e) { fail('Could not start the runtime.<br><code>' + e + '</code>'); return; }
  window.addEventListener('resize', fit);
  new ResizeObserver(fit).observe(document.getElementById('stage'));
  var animName = null;
  var ctl = document.getElementById('ctl');
  var hl = document.getElementById('hl'), hlname = document.getElementById('hlname');
  var frame = 0, playing = false;
  function axisValue(i,n,start,span,cyclic,suffix){
    if (!span) return String(i); var d = cyclic ? n : Math.max(1,n-1);
    var v = start + span * i / d; var near = Math.round(v);
    return (Math.abs(v-near) < 0.005 ? String(near) : v.toFixed(1)) + (suffix || ''); }
  function frameValue(f){ return axisValue(f,META.n,META.f0||0,META.fv||0,!!META.fc,META.fu||''); }
  function xf(){ var b = cv.getBoundingClientRect();
    var sc = Math.min(b.width / META.aw, b.height / META.ah);
    return { sc: sc, ox: (b.width - META.aw * sc) / 2,
             oy: (b.height - META.ah * sc) / 2, rect: b }; }
  function seek(f){ frame = f; tAcc = META.fps > 0 ? f / META.fps : 0;
    if (!r || !animName || !(META.fps > 0)) return;
    try { r.pause(); r.scrub(animName, f / META.fps); } catch (e) {}
    playing = false; document.getElementById('pp').textContent = 'play sampled poses';
    drawHl(null); drawAll(); }
  function boxesNow(){ if (!META.b || !META.b.length) return null;
    var i = Math.min(META.b.length - 1, Math.floor(frame / (META.bs || 1)));
    return META.b[i]; }
  var ol = document.getElementById('ol'), tAcc = 0;
  function drawAll(){ ol.innerHTML = '';
    var on = document.getElementById('cb').checked; var bs = on ? boxesNow() : null;
    if (!bs) return; var t = xf();
    for (var i = 0; i < bs.length; i++) { var b = bs[i], d = document.createElement('div');
      d.style.left = (t.ox + b[1]*t.sc) + 'px'; d.style.top = (t.oy + b[2]*t.sc) + 'px';
      d.style.width = (b[3]*t.sc) + 'px'; d.style.height = (b[4]*t.sc) + 'px';
      ol.appendChild(d); } }
  function drawHl(bx){ if (!bx) { hl.style.display='none'; hlname.style.display='none'; return; }
    var t = xf();
    hl.style.display='block'; hlname.style.display='block';
    hl.style.left = (t.ox + bx[1]*t.sc) + 'px'; hl.style.top = (t.oy + bx[2]*t.sc) + 'px';
    hl.style.width = (bx[3]*t.sc) + 'px'; hl.style.height = (bx[4]*t.sc) + 'px';
    hlname.textContent = bx[0];
    hlname.style.left = (t.ox + bx[1]*t.sc) + 'px';
    hlname.style.top = (t.oy + bx[2]*t.sc - 2) + 'px'; }
  cv.addEventListener('mousemove', function(ev){
    var bs = boxesNow(); if (!bs || !document.getElementById('cb').checked) { drawHl(null); return; }
    var t = xf();
    var ax = (ev.clientX - t.rect.left - t.ox) / t.sc;
    var ay = (ev.clientY - t.rect.top - t.oy) / t.sc;
    var best = null, bestA = 1e30;
    for (var i = 0; i < bs.length; i++) { var b = bs[i];
      if (ax >= b[1] && ax <= b[1]+b[3] && ay >= b[2] && ay <= b[2]+b[4]) {
        var a = b[3]*b[4]; if (a < bestA) { bestA = a; best = b; } } }
    drawHl(best); });
  cv.addEventListener('mouseleave', function(){ drawHl(null); });
  function setupUi(){
    try { animName = r.animationNames && r.animationNames[0]; } catch (e) {}
    var any = false;
    var pp = document.getElementById('pp');
    pp.addEventListener('click', function(){ if (!r) return;
      if (playing) { try { r.pause(); } catch(e){} playing = false; pp.textContent='play sampled poses'; }
      else { try { r.play(); } catch(e){} playing = true; pp.textContent='pause'; } });
    if (META.n > 1 && META.fps > 0 && animName) { any = true;
      var lf = document.getElementById('lf'), sf = document.getElementById('sf'),
          of = document.getElementById('of');
      document.getElementById('nf').textContent = META.fl || 'frame';
      lf.hidden = false; sf.max = String(META.n - 1); of.textContent = frameValue(0);
      sf.addEventListener('input', function(){ var f = +sf.value; of.textContent = frameValue(f);
        seek(f); if (META.gx) syncXY(f); });
      if (META.gx && META.gy) {
        var lx = document.getElementById('lx'), sx = document.getElementById('sx'),
            ox2 = document.getElementById('ox'), nx = document.getElementById('nx');
        var ly = document.getElementById('ly'), sy = document.getElementById('sy'),
            oy2 = document.getElementById('oy'), ny = document.getElementById('ny');
        lx.hidden = false; ly.hidden = false;
        nx.textContent = META.lx || 'X'; ny.textContent = META.ly || 'Y';
        sx.max = String(META.gx - 1); sy.max = String(META.gy - 1);
        var apply = function(){ var f = (+sy.value) * META.gx + (+sx.value);
          ox2.textContent = axisValue(+sx.value,META.gx,META.x0||0,META.xv||0,!!META.xc,META.xu||'');
          oy2.textContent = axisValue(+sy.value,META.gy,META.y0||0,META.yv||0,!!META.yc,META.yu||'');
          sf.value = String(f); of.textContent = frameValue(f); seek(f); };
        sx.addEventListener('input', apply); sy.addEventListener('input', apply);
        window.syncXY = function(f){ sx.value = String(f % META.gx);
          sy.value = String(Math.floor(f / META.gx));
          ox2.textContent = axisValue(+sx.value,META.gx,META.x0||0,META.xv||0,!!META.xc,META.xu||'');
          oy2.textContent = axisValue(+sy.value,META.gy,META.y0||0,META.yv||0,!!META.yc,META.yu||''); };
      }
    }
    if (META.b && META.b.length) { any = true;
      document.getElementById('lb').hidden = false;
      document.getElementById('cb').addEventListener('change', drawAll); }
    try { r.on(rive.EventType.Advance, function(e){
      if (!playing || !(META.fps > 0) || !(META.n > 1)) return;
      var dt = (e && typeof e.data === 'number') ? e.data : 0; tAcc += dt;
      var f = Math.floor(tAcc * META.fps) % META.n; if (f === frame) return;
      frame = f; var sf2 = document.getElementById('sf');
      if (sf2) { sf2.value = String(f); document.getElementById('of').textContent = frameValue(f); }
      if (META.gx) syncXY(f); drawAll(); }); } catch (e) {}
    drawAll();
    if (any) ctl.hidden = false;
  }
  if (!window.syncXY) window.syncXY = function(){};
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) fit(); });
})();
</script>
